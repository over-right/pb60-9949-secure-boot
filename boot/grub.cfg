serial --unit=0 --speed=115200
terminal_output serial console
set timeout=-1
set default=0
menuentry 'PB60: Run read-only diagnostic' {
  chainloader /EFI/BOOT/PB60DIAG.EFI
  boot
}
menuentry 'PB60: Enroll one helper hash' {
  chainloader /EFI/BOOT/mmx64.efi
  boot
}
menuentry 'PB60: Attempt one Custom-mode write' {
  chainloader /EFI/BOOT/PB60MODE.EFI
  boot
}
